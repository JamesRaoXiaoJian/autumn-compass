<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">Autumn Compass project overview</title>
  <desc id="desc">A privacy-first recruitment workspace connecting a browser dashboard to a loopback API and local SQLite database.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/><stop offset="0.5" stop-color="#f5f2e8"/><stop offset="1" stop-color="#e8efe9"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c86138"/><stop offset="1" stop-color="#1f6a5a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#20332e" flood-opacity=".13"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#486056" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1440" height="620" rx="32" fill="url(#bg)"/><rect width="1440" height="620" rx="32" fill="url(#grid)"/>
  <circle cx="1180" cy="100" r="210" fill="#d6e4dd" opacity=".55"/><circle cx="190" cy="580" r="250" fill="#f2d8c3" opacity=".5"/>
  <g transform="translate(92 88)">
    <g transform="translate(0 8)"><circle cx="38" cy="38" r="37" fill="#183f36"/><circle cx="38" cy="38" r="25" fill="none" stroke="#f4e2c5" stroke-width="2"/><path d="M48 21 42 42 21 49l14-14z" fill="#ef9b67"/><circle cx="38" cy="38" r="4" fill="#fffaf0"/></g>
    <text x="96" y="38" font-family="ui-serif,Georgia,serif" font-size="24" letter-spacing="4" fill="#8b4b30">AUTUMN COMPASS</text>
    <text x="96" y="92" font-family="ui-serif,Georgia,serif" font-size="54" font-weight="700" fill="#183f36">把秋招走成一条清晰的路</text>
    <text x="96" y="132" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" fill="#52625c">岗位核验 · 投递流转 · 面试安排 · 简历证据，全部留在你掌控的设备上</text>
  </g>
  <path d="M250 386C430 305 500 475 680 393s300-83 502 11" fill="none" stroke="#f8f3e9" stroke-width="22" stroke-linecap="round"/>
  <path d="M250 386C430 305 500 475 680 393s300-83 502 11" fill="none" stroke="url(#route)" stroke-width="6" stroke-linecap="round" stroke-dasharray="3 13"/>
  <g filter="url(#shadow)" font-family="ui-sans-serif,system-ui,sans-serif">
    <g transform="translate(120 315)"><rect width="260" height="156" rx="24" fill="#fffdfa" stroke="#ead8c7"/><rect x="24" y="24" width="48" height="48" rx="15" fill="#fae4d5"/><path d="M36 38h24v19H36zM41 34h14v5H41z" fill="none" stroke="#b95331" stroke-width="2.5"/><text x="88" y="48" font-size="14" font-weight="700" letter-spacing="2" fill="#b95331">BROWSER</text><text x="24" y="100" font-size="24" font-weight="700" fill="#203a33">招聘工作台</text><text x="24" y="128" font-size="15" fill="#68766f">只访问同源 /api</text></g>
    <g transform="translate(590 315)"><rect width="260" height="156" rx="24" fill="#fffdfa" stroke="#d8dfd8"/><rect x="24" y="24" width="48" height="48" rx="15" fill="#dfece5"/><path d="M38 38h20M38 48h20M38 58h20" stroke="#236553" stroke-width="3" stroke-linecap="round"/><text x="88" y="48" font-size="14" font-weight="700" letter-spacing="2" fill="#236553">LOOPBACK</text><text x="24" y="100" font-size="24" font-weight="700" fill="#203a33">Node.js API</text><text x="24" y="128" font-size="15" fill="#68766f">原子保存 · SSE 同步</text></g>
    <g transform="translate(1060 315)"><rect width="260" height="156" rx="24" fill="#fffdfa" stroke="#d8dfd8"/><rect x="24" y="24" width="48" height="48" rx="15" fill="#dfece5"/><ellipse cx="48" cy="38" rx="13" ry="6" fill="none" stroke="#236553" stroke-width="2.5"/><path d="M35 38v20c0 4 6 7 13 7s13-3 13-7V38M35 48c0 4 6 7 13 7s13-3 13-7" fill="none" stroke="#236553" stroke-width="2.5"/><text x="88" y="48" font-size="14" font-weight="700" letter-spacing="2" fill="#236553">LOCAL FIRST</text><text x="24" y="100" font-size="24" font-weight="700" fill="#203a33">SQLite</text><text x="24" y="128" font-size="15" fill="#68766f">简历与流程不进 Git</text></g>
  </g>
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700"><rect x="948" y="92" width="136" height="36" rx="18" fill="#fffdfa" stroke="#d8dfd8"/><text x="976" y="115" fill="#236553">SELF-HOSTED</text><rect x="1098" y="92" width="134" height="36" rx="18" fill="#fffdfa" stroke="#ead8c7"/><text x="1128" y="115" fill="#b95331">PRIVACY-FIRST</text><rect x="1246" y="92" width="100" height="36" rx="18" fill="#183f36"/><text x="1276" y="115" fill="#fffaf0">MIT</text></g>
</svg>
